name: Promote to Prod

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA to promote to production
        required: true
        type: string
      production_url:
        description: Production URL
        required: true
        default: https://www.example.com
        type: string

jobs:
  validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Validate commit is available on main
        shell: bash
        run: |
          echo "Validating commit: ${{ github.event.inputs.commit_sha }}"
          git ls-remote origin main | grep "${{ github.event.inputs.commit_sha }}" >/dev/null
          echo "The selected SHA is present on the main branch and is eligible for promotion."

  deploy-prod:
    needs: validate-commit
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: ${{ github.event.inputs.production_url }}
    steps:
      - name: Check out repository at the selected SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Deploy to production
        run: |
          echo "Promoting ${{ github.event.inputs.commit_sha }} to production"
          ls -la ./dist
